<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#0B2240"/>
  <!-- Brickwork Pattern in Emerald Accent -->
  <g fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(64, 64) scale(0.75)">
    <!-- Outer boundary -->
    <rect x="40" y="40" width="432" height="432" rx="48" stroke="#34D399" stroke-width="28"/>
    <!-- Horizontal Mortar Lines -->
    <line x1="40" y1="184" x2="472" y2="184" stroke="#10B981" stroke-width="24"/>
    <line x1="40" y1="328" x2="472" y2="328" stroke="#10B981" stroke-width="24"/>
    <!-- Vertical Mortar Lines -->
    <line x1="256" y1="40" x2="256" y2="184" stroke="#10B981" stroke-width="24"/>
    <line x1="148" y1="184" x2="148" y2="328" stroke="#10B981" stroke-width="24"/>
    <line x1="364" y1="184" x2="364" y2="328" stroke="#10B981" stroke-width="24"/>
    <line x1="256" y1="328" x2="256" y2="472" stroke="#10B981" stroke-width="24"/>
  </g>
</svg>
